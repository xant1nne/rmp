[package]
name = "rmp"
version = "0.1.0"
edition = "2021"
description = "TUI music player: local files, YouTube/SoundCloud via yt-dlp, Discord RPC"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
rustfft = "6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rand = "0.8"
walkdir = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lofty = "0.25.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
